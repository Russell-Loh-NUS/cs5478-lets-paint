name: Rule-based painting tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rule-based-painting:
    name: Verify rule-based painting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify painting and collisions
        run: |
          python -u verify_painting.py 2>&1 | tee verification.log

      - name: Run full room and require complete coverage
        run: |
          python -u main.py --headless 2>&1 | tee full-run.log
          if ! grep -Fxq "All walls complete!" full-run.log; then
            echo "::error::Simulation did not complete all walls."
            exit 1
          fi

      - name: Save test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-based-painting-logs
          path: |
            verification.log
            full-run.log
          if-no-files-found: ignore